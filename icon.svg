<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="30%" cy="20%" r="90%">
      <stop offset="0%" stop-color="#1e2238"/>
      <stop offset="50%" stop-color="#121526"/>
      <stop offset="100%" stop-color="#0a0c16"/>
    </radialGradient>

    <!-- Gemini Magic Sparkle Gradient -->
    <linearGradient id="geminiSparkle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4E95FF"/>
      <stop offset="30%" stop-color="#7B61FF"/>
      <stop offset="70%" stop-color="#C05CFF"/>
      <stop offset="100%" stop-color="#FF5E97"/>
    </linearGradient>

    <!-- Secondary Star Gradient -->
    <linearGradient id="starAccent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#70A6FF"/>
    </linearGradient>

    <!-- Fast-Send Comet Beam Gradient -->
    <linearGradient id="sendBeam" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#FF5E97" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FF5E97" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="coreGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base Squircle with subtle border -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)"/>
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="#2d3559" stroke-width="3" stroke-opacity="0.6"/>

  <!-- Ambient Light Behind Core Sparkle -->
  <circle cx="230" cy="246" r="140" fill="#7B61FF" opacity="0.22" filter="url(#coreGlow)"/>
  <circle cx="340" cy="180" r="90" fill="#00F0FF" opacity="0.18" filter="url(#coreGlow)"/>

  <!-- Speed / Direct Send Streaks (Representing Instant Action) -->
  <g opacity="0.75">
    <path d="M 80 320 C 130 320, 160 300, 200 270" stroke="url(#geminiSparkle)" stroke-width="4" stroke-linecap="round" fill="none" stroke-dasharray="8 12"/>
    <path d="M 100 355 C 160 355, 190 335, 230 295" stroke="url(#geminiSparkle)" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.5"/>
  </g>

  <!-- Main Gemini 4-Pointed Celestial Star -->
  <path d="M 230 90
           Q 230 240, 90 240
           Q 230 240, 230 390
           Q 230 240, 370 240
           Q 230 240, 230 90 Z"
        fill="url(#geminiSparkle)"
        filter="url(#softGlow)"/>

  <!-- Core Inner White Highlight of Main Star -->
  <path d="M 230 150
           Q 230 240, 150 240
           Q 230 240, 230 330
           Q 230 240, 310 240
           Q 230 240, 230 150 Z"
        fill="#FFFFFF"
        opacity="0.82"
        filter="url(#softGlow)"/>

  <!-- Top-Right Accent Sparkle (Twin / AI Intelligence) -->
  <path d="M 370 120
           Q 370 175, 315 175
           Q 370 175, 370 230
           Q 370 175, 425 175
           Q 370 175, 370 120 Z"
        fill="url(#starAccent)"
        filter="url(#softGlow)"/>

  <!-- Tiny Bottom Star Sparkle -->
  <path d="M 140 370
           Q 140 395, 115 395
           Q 140 395, 140 420
           Q 140 395, 165 395
           Q 140 395, 140 370 Z"
        fill="#00F0FF"
        opacity="0.85"/>

  <!-- Fast Send Arrow Badge (Bottom Right - symbolizes Instant Execution) -->
  <g transform="translate(325, 325)">
    <!-- Badge Background Circle -->
    <circle cx="45" cy="45" r="46" fill="#181c30" stroke="#3c4775" stroke-width="2.5"/>
    <circle cx="45" cy="45" r="46" fill="url(#geminiSparkle)" opacity="0.15"/>
    <!-- Sleek Paper Plane / Send Icon -->
    <path d="M 26 62 L 68 45 L 26 28 L 33 42 L 53 45 L 33 48 Z"
          fill="#FFFFFF"
          filter="url(#softGlow)"/>
  </g>
</svg>
